# Les PR de version partent de `develop` (AGENTS.md § 4). Les mises à jour de SÉCURITÉ de Dependabot ciblent
# toujours la branche par défaut (`main`) : les refaire vers `develop` plutôt que de les fusionner telles quelles.
# Documentation : https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Vite, son plugin React et Vitest dépendent les uns des autres : ils montent ensemble (voir #165).
      outils-vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"

name: Recette automatique Francais

on:
  pull_request:
    paths:
      - "api/**"
      - "engine/**"
      - "contenu/francais/**"
      - ".github/workflows/recette-francais.yml"
  workflow_dispatch:

# Un push plus récent sur la même PR remplace l'exécution en cours. Hors PR, un groupe par commit :
# aucune exécution de main n'est annulée, même en attente (#256).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Tests front et compilation : job « Front » de ci.yml, lancé sur chaque PR (#256).
jobs:
  contrat-francais:
    name: Contrat Francais - API et habilitations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            engine/pyproject.toml
      - name: Installer moteur et API
        run: python -m pip install -e "./engine[dev]" -e "./api[dev]"
      - name: Tester import, domaine, admin, professeur, validation, eleve et confidentialite
        working-directory: api
        run: |
          mkdir -p ../rapports
          python -m pytest -q tests/test_francais.py -W ignore::DeprecationWarning --junitxml=../rapports/francais-api.xml
      - name: Conserver les preuves meme en cas d'echec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recette-francais-api
          path: rapports/francais-api.xml
          if-no-files-found: warn
          retention-days: 14

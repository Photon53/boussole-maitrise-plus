# Vérifie chaque push et chaque pull request : moteur, API, contenu pédagogique, front.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push plus récent sur la même PR remplace l'exécution en cours. Hors PR, un groupe par commit :
# aucune exécution de main n'est annulée, même en attente (#256).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Moteur, API et contenu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            api/pyproject.toml
      - name: Installer
        run: pip install -e "./engine[dev]" -e "./api[dev]"
      - name: Vérifier le contenu pédagogique (contenu/*.yaml)
        working-directory: api
        run: python -m app.contenu verifier
      - name: Tests du moteur
        working-directory: engine
        run: pytest -q
      - name: Tests de l'API
        working-directory: api
        run: pytest -q -n auto -W ignore::DeprecationWarning

  web:
    name: Front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "^24.15.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Audit A-04 : aucune vulnérabilité high/critical dans ce qui est livré au navigateur.
      - name: Vulnérabilités des dépendances livrées
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform DEV (format et validation, sans accès GCP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/dev
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      # -backend=false : aucun état, aucun identifiant ; seul le registre des fournisseurs est contacté.
      - run: terraform init -input=false -backend=false
      - run: terraform validate
      - name: Scripts shell (syntaxe)
        working-directory: .
        run: for f in scripts/*.sh deploy/*.sh infrastructure/terraform/dev/*.sh; do bash -n "$f"; done
      - name: Publication DEV contre un faux GCS (sans accès GCP)
        working-directory: .
        run: bash scripts/test-dev-publier-version.sh
      - name: Synchronisation de la VM DEV contre un faux docker et de faux services (sans VM ni GCP)
        working-directory: .
        run: |
          bash -n deploy/vm/boussole-dev-sync
          bash deploy/vm/tests/test-boussole-dev-sync.sh
          bash deploy/vm/tests/test-refus-deploiement-manuel.sh
          bash scripts/tests/test-controle-acces-sauvegardes.sh
      # Banc des sauvegardes : faux docker et faux gcloud, vrai age ; EXIGER_AGE=1 interdit le saut silencieux (#265).
      - name: Sauvegardes chiffrées contre un faux docker et un faux GCS (sans base ni GCP)
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends age
          EXIGER_AGE=1 bash deploy/sauvegarde/tests/test-sauvegarde-prod.sh

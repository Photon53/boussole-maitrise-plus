name: GCP DEV Terraform
on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply (never destroy)"
        type: choice
        required: true
        options: [plan, apply]
        default: plan
permissions:
  contents: read
  id-token: write
concurrency:
  group: gcp-dev-terraform
  cancel-in-progress: false
jobs:
  terraform:
    if: github.ref == 'refs/heads/infra/gcp-dev-bootstrap'
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: infrastructure/terraform/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEV_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
      - name: Terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="prefix=dev"
      - name: Validate
        run: terraform fmt -check && terraform validate
      - name: Plan
        env:
          TF_VAR_project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
          TF_VAR_admin_members: ${{ vars.GCP_DEV_ADMIN_MEMBERS_JSON }}
        run: terraform plan -input=false -out=tfplan
      - name: Apply (explicit approval required)
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

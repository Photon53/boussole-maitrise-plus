name: Importer PKP Math Lycée vers Boussole Maîtrise+
on:
  push:
    branches: [migration-pkp-vers-boussole]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt commercial
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: migration-pkp-vers-boussole

      - name: Récupérer la dernière version de PKP main
        run: |
          git clone --depth=1 --branch main https://github.com/Photon53/pkp-math-lycee.git "$RUNNER_TEMP/source"
          echo "SOURCE_SHA=$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copier sans modifier le dépôt source
        run: |
          rsync -a --exclude='.git' --exclude='LICENSE' --exclude='.github/workflows/' "$RUNNER_TEMP/source/" ./
          if [ -f pkp-math-lycee.code-workspace ]; then
            mv pkp-math-lycee.code-workspace boussole-maitrise-plus.code-workspace
          fi

      - name: Appliquer la nouvelle marque visible
        shell: python
        run: |
          from pathlib import Path

          changes = {
              "web/index.html": [
                  ("<title>Boussole — Maîtrise+</title>", "<title>Boussole Maîtrise+ — La boussole de votre réussite scolaire</title>"),
                  ("Boussole : cours structurés", "Boussole Maîtrise+ : cours structurés"),
              ],
              "web/src/App.jsx": [
                  ("© {new Date().getFullYear()} Boussole", "© {new Date().getFullYear()} Boussole Maîtrise+"),
              ],
              "api/app/main.py": [
                  ('title="Boussole"', 'title="Boussole Maîtrise+"'),
              ],
          }
          for filename, substitutions in changes.items():
              path = Path(filename)
              if not path.exists():
                  continue
              data = path.read_text(encoding="utf-8")
              for old, new in substitutions:
                  data = data.replace(old, new)
              path.write_text(data, encoding="utf-8")
          # Les noms internes (PKP_*, pkp-api, pkp-engine et chemins /pkp)
          # sont conservés : les remplacer sans migration casserait l'application.
          for path in Path("web/src").rglob("*"):
              if path.is_file() and path.suffix in {".jsx", ".js", ".css"}:
                  data = path.read_text(encoding="utf-8")
                  updated = data.replace("PKP Math Lycée", "Boussole Maîtrise+").replace("PKP Éducation", "Boussole Maîtrise+")
                  if updated != data:
                      path.write_text(updated, encoding="utf-8")
          original = Path("README.md").read_text(encoding="utf-8")
          original = original.replace("# PKP Math Lycée", "# Boussole Maîtrise+\n\n**La boussole de votre réussite scolaire**", 1)
          original = original.replace("Plateforme de soutien scolaire en mathématiques pour le lycée.", "Plateforme pédagogique adaptative pour le collège et le lycée (mathématiques et anglais ; autres matières à développer).")
          original = original.replace("pkp-math-lycee.code-workspace", "boussole-maitrise-plus.code-workspace")
          Path("README.md").write_text(original, encoding="utf-8")

      - name: Tracer l'origine de la copie
        run: |
          printf '# Migration vers Boussole Maîtrise+\n\nDépôt source : Photon53/pkp-math-lycee\nBranche source : main\nCommit source : `%s`\n\nCopie des fichiers Git suivis dans le dépôt source, y compris les PDF pédagogiques.\nLe dépôt source reste inchangé.\n\nLes identifiants internes PKP sont conservés pour compatibilité.\nLes secrets et bases de données non suivis par Git ne sont pas copiés.\n\nLa licence UNLICENSE préexistante du dépôt cible est conservée et doit être examinée avant commercialisation.\n' "$SOURCE_SHA" > MIGRATION.md

      - name: Vérifier le nombre de fichiers importés
        run: |
          test -f web/package.json
          test -f api/pyproject.toml
          test -f engine/pyproject.toml
          test -f referentiels/sources/bo-2026-14-2nde-gt-515402.pdf
          echo "Fichiers du dépôt commercial :"
          find . -type f -not -path './.git/*' | wc -l

      - name: Commit et push sur la branche de migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: importer PKP main et adapter la marque Boussole Maîtrise+"
            git push origin HEAD:migration-pkp-vers-boussole
          fi
